name: Testy a kontrola

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Spustenie regresných testov strážcu siete
        run: |
          python -I -X utf8 skills/rodokmen/tools/slusne.py tests/brzda/test_hlidac.py skills/rodokmen
